# SPDX-License-Identifier: BSD-3-Clause
#
# fetch-source-pkg.yml
#
# Clones the Canonical Ubuntu kernel from the Launchpad git repository at
# the tag corresponding to the latest published source package version, and
# commits the full source tree (including the complete debian/ directory) to
# a branch named after the Ubuntu suite (e.g. "noble", "questing").
#
# Why git instead of the source package?
#   The Ubuntu kernel source package (format 1.0) ships only debian.master/
#   with rules.d/ fragments — debian/rules is NOT included. The complete
#   debian/ directory (with rules, scripts/, templates/, etc.) lives in the
#   Launchpad git repository. Using the git source gives a buildable tree.
#
# Repository branch layout
# ─────────────────────────
#   main          – CI infrastructure: workflows, scripts, documentation
#   noble         – Ubuntu Noble (24.04 LTS) kernel source, one commit/upload
#   <suite>       – additional suites added on demand (questing, resolute, …)
#
# Each commit on a suite branch is tagged  <suite>-<version>
# (e.g.  noble-6.8.0-114.114).
#
# Repository variables (Settings → Variables → Actions):
#   KERNEL_SUITE   – default suite to sync when not specified (default: questing)
#   KERNEL_SOURCE  – source package name (default: linux)

name: "Sync: Canonical Kernel Sources to Branch"

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      suite:
        description: "Ubuntu suite to sync (e.g. noble, questing, resolute)"
        required: false
        default: "questing"
        type: string
      force:
        description: "Force sync even if this version is already committed"
        type: boolean
        default: false
      custom_git_url:
        description: >
          Custom Launchpad git URL to clone from instead of the official
          Ubuntu kernel repo. Leave empty to use the default.
          Example: https://git.launchpad.net/~carmel-team/ubuntu/+source/linux/+git/resolute
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

jobs:
  check-version:
    name: "Check latest version on Launchpad"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    outputs:
      version:          ${{ steps.query.outputs.version }}
      upstream_version: ${{ steps.query.outputs.upstream_version }}
      tag:              ${{ steps.query.outputs.tag }}
      suite:            ${{ steps.query.outputs.suite }}
      source:           ${{ steps.query.outputs.source }}
      git_url:          ${{ steps.query.outputs.git_url }}
      should_sync:      ${{ steps.gate.outputs.should_sync }}

    steps:
      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends jq

      - name: Resolve version and git URL
        id: query
        env:
          SUITE:          ${{ inputs.suite || vars.KERNEL_SUITE || 'questing' }}
          SOURCE:         ${{ vars.KERNEL_SOURCE || 'linux' }}
          CUSTOM_GIT_URL: ${{ inputs.custom_git_url || '' }}
        run: |
          if [ -n "${CUSTOM_GIT_URL}" ]; then
            # ----------------------------------------------------------------
            # Custom repo path: find the latest Ubuntu-* tag via git ls-remote.
            # This bypasses the Launchpad REST API entirely — the version is
            # derived directly from the tags present in the custom repository.
            # ----------------------------------------------------------------
            echo "Custom git URL provided: ${CUSTOM_GIT_URL}"
            echo "Querying tags from custom repo..."

            LATEST_TAG=$(git ls-remote --tags "${CUSTOM_GIT_URL}" 'refs/tags/Ubuntu-*' \
              | grep -v '\^{}' \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | sort -V \
              | tail -1)

            [ -n "${LATEST_TAG}" ] || {
              echo "ERROR: No Ubuntu-* tags found in ${CUSTOM_GIT_URL}" >&2
              exit 1
            }

            # Ubuntu-7.0.0-1.1 → 7.0.0-1.1
            VERSION="${LATEST_TAG#Ubuntu-}"
            GIT_URL="${CUSTOM_GIT_URL}"

            echo "Latest tag : ${LATEST_TAG}"
          else
            # ----------------------------------------------------------------
            # Default path: query the Launchpad REST API for the latest
            # officially published source package version, then construct
            # the standard Launchpad git URL for the suite.
            # ----------------------------------------------------------------
            API="https://api.launchpad.net/1.0/ubuntu/+archive/primary"
            API+="?ws.op=getPublishedSources"
            API+="&source_name=${SOURCE}"
            API+="&distro_series=/ubuntu/${SUITE}"
            API+="&status=Published"
            API+="&order_by_date=true"
            API+="&ws.size=300"

            echo "Querying: ${API}"
            RESP=$(curl -fsSL "${API}")

            VERSION=$(echo "$RESP" | jq -r \
              --arg name "${SOURCE}" \
              '[.entries[] | select(.source_package_name == $name)] | .[0].source_package_version // empty')
            [ -n "${VERSION}" ] || {
              echo "ERROR: No exact match for '${SOURCE}' in ${SUITE}" >&2
              exit 1
            }

            GIT_URL="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/${SUITE}"
          fi

          UPSTREAM=$(echo "${VERSION}" | cut -d'-' -f1)
          TAG="${SUITE}-${VERSION}"

          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                   >> "$GITHUB_OUTPUT"
          echo "suite=${SUITE}"               >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE}"             >> "$GITHUB_OUTPUT"
          echo "git_url=${GIT_URL}"           >> "$GITHUB_OUTPUT"

          echo "Suite   : ${SUITE}"
          echo "Version : ${VERSION}"
          echo "Tag     : ${TAG}"
          echo "Git URL : ${GIT_URL}"

      - name: Check whether tag already exists
        id: gate
        env:
          TAG: ${{ steps.query.outputs.tag }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Force flag set – will re-sync"
            exit 0
          fi

          if git ls-remote --exit-code --tags \
               "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
               "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' already exists – nothing to do"
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' not found – will sync"
          fi

  sync:
    name: "Sync ${{ needs.check-version.outputs.suite }} sources to branch"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    needs: check-version
    if: needs.check-version.outputs.should_sync == 'true'

    env:
      VERSION:          ${{ needs.check-version.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.check-version.outputs.upstream_version }}
      TAG:              ${{ needs.check-version.outputs.tag }}
      SUITE:            ${{ needs.check-version.outputs.suite }}
      SOURCE:           ${{ needs.check-version.outputs.source }}
      GIT_URL:          ${{ needs.check-version.outputs.git_url }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Free up disk space
      # -----------------------------------------------------------------------
      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" \
            2>/dev/null || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      # -----------------------------------------------------------------------
      # 2. Install tools
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl jq rsync

      # -----------------------------------------------------------------------
      # 3. Clone from the resolved git URL at the version tag.
      #    GIT_URL is either the custom repo URL (when custom_git_url input
      #    was provided) or the standard Launchpad URL for the suite.
      #    The git repository has the complete debian/ directory including
      #    debian/rules, scripts/, templates/, etc. — unlike the source
      #    package which only ships debian.master/ with rules.d/ fragments.
      # -----------------------------------------------------------------------
      - name: Clone from git repo at version tag
        run: |
          GIT_TAG="Ubuntu-${VERSION}"

          echo "Cloning ${GIT_URL} at tag ${GIT_TAG} (shallow)..."
          git clone --depth=1 --branch "${GIT_TAG}" "${GIT_URL}" kernel-src/

          echo "SRC_DIR=kernel-src" >> "$GITHUB_ENV"

          FILE_COUNT=$(find kernel-src/ -type f | wc -l)
          echo "Cloned ${FILE_COUNT} files"
          [ "${FILE_COUNT}" -gt 5000 ] || {
            echo "ERROR: Too few files cloned (${FILE_COUNT})"
            exit 1
          }

          echo "Top-level contents:"
          ls kernel-src/

          echo "debian/ contents:"
          ls kernel-src/debian/ | head -20

      # -----------------------------------------------------------------------
      # 4. Configure git
      # -----------------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

      # -----------------------------------------------------------------------
      # 5. Prepare the suite branch
      # -----------------------------------------------------------------------
      - name: Clone repository for suite branch update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git clone "${REPO_URL}" suite-repo

      - name: Check out or create suite branch
        run: |
          cd suite-repo

          if git ls-remote --exit-code origin "refs/heads/${SUITE}" >/dev/null 2>&1; then
            echo "Branch '${SUITE}' exists – checking out"
            git checkout "${SUITE}"
            git rm -rf --quiet . 2>/dev/null || true
          else
            echo "Branch '${SUITE}' does not exist – creating orphan branch"
            git checkout --orphan "${SUITE}"
            git rm -rf --quiet . 2>/dev/null || true
          fi

      - name: Populate suite branch with cloned source
        run: |
          echo "Copying source tree from ${SRC_DIR} → suite-repo/"
          rsync -a --delete \
            --exclude='.git' \
            "${SRC_DIR}/" suite-repo/

          COPIED=$(find suite-repo/ -type f | wc -l)
          echo "Files in suite-repo after rsync: ${COPIED}"
          [ "${COPIED}" -gt 5000 ] || {
            echo "ERROR: rsync copied only ${COPIED} files"
            exit 1
          }

          cd suite-repo

          SYNC_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          printf '%s\n\n%s\n%s\n%s\n%s\n%s\n' \
            "${SUITE}: ${VERSION}" \
            "Ubuntu suite   : ${SUITE}" \
            "Kernel version : ${VERSION}" \
            "Upstream       : ${UPSTREAM_VERSION}" \
            "Source         : ${GIT_URL} (tag: Ubuntu-${VERSION})" \
            "Synced         : ${SYNC_DATE}" \
            > /tmp/commit-msg.txt

          git add --all

          if git diff --cached --quiet; then
            echo "No changes to commit – suite branch already has this content"
          else
            git commit -F /tmp/commit-msg.txt
            echo "Committed ${SUITE} branch at $(git rev-parse HEAD)"
          fi

      - name: Tag the commit
        run: |
          cd suite-repo
          git tag -fa "${TAG}" -m "Ubuntu ${SUITE} kernel ${VERSION}"
          echo "Tagged: ${TAG}"

      - name: Push suite branch and tag
        run: |
          cd suite-repo
          git push origin "${SUITE}"
          git push --force origin "${TAG}"
          echo "Pushed branch '${SUITE}' and tag '${TAG}'"

      # -----------------------------------------------------------------------
      # 6. Summary
      # -----------------------------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          GIT_TAG="Ubuntu-${VERSION}"

          echo "## Source Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite      | \`${SUITE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version    | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch     | [\`${SUITE}\`](https://github.com/${{ github.repository }}/tree/${SUITE}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag        | [\`${TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${TAG}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cloned from | \`${GIT_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Git tag    | \`${GIT_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Launchpad  | https://launchpad.net/ubuntu/${SUITE}/+source/${SOURCE}/${VERSION} |" >> "$GITHUB_STEP_SUMMARY"

  trigger-build:
    name: "Trigger kernel build"
    runs-on: ubuntu-24.04-arm
    needs: [check-version, sync]
    if: needs.sync.result == 'success'

    steps:
      - name: Dispatch build-kernel workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE:    ${{ needs.check-version.outputs.suite }}
          VERSION:  ${{ needs.check-version.outputs.version }}
        run: |
          gh workflow run build-kernel.yml \
            --repo "${{ github.repository }}" \
            --field suite="${SUITE}" \
            --field kernel_version="${VERSION}" \
            --field arch="arm64" \
            --field flavor="generic" \
            --field runner="ubuntu-24.04-arm"

          echo "Build workflow dispatched for ${SUITE} ${VERSION}"
