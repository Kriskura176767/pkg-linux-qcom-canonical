# SPDX-License-Identifier: BSD-3-Clause
#
# fetch-source-pkg.yml
#
# Fetches the latest Canonical Ubuntu kernel source package from Launchpad,
# extracts it with dpkg-source, and commits the full source tree to a branch
# named after the Ubuntu series (e.g. "noble", "questing").
#
# Repository branch layout
# ─────────────────────────
#   main          – CI infrastructure: workflows, scripts, documentation
#   noble         – Ubuntu Noble (24.04 LTS) kernel source, one commit/upload
#   <series>      – additional series added on demand (questing, resolute, …)
#
# Each commit on a series branch is tagged  <series>-<version>
# (e.g.  noble-6.8.0-51.52).
#
# The workflow is idempotent: if the tag already exists it exits cleanly.
# On success it automatically dispatches build-kernel.yml.
#
# Repository variables (Settings → Variables → Actions):
#   KERNEL_SERIES  – default series to sync when not specified (default: noble)
#   KERNEL_SOURCE  – source package name (default: linux)

name: "Sync: Canonical Kernel Sources to Branch"

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      series:
        description: "Ubuntu series to sync (e.g. noble, questing, resolute)"
        required: false
        default: "noble"
        type: string
      force:
        description: "Force sync even if this version is already committed"
        type: boolean
        default: false

permissions:
  contents: write   # push to series branch + create tags

jobs:
  # --------------------------------------------------------------------------
  # Job 1: check-version
  #   Queries Launchpad and decides whether a sync is needed.
  # --------------------------------------------------------------------------
  check-version:
    name: "Check latest version on Launchpad"
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    timeout-minutes: 10

    outputs:
      version:          ${{ steps.query.outputs.version }}
      upstream_version: ${{ steps.query.outputs.upstream_version }}
      tag:              ${{ steps.query.outputs.tag }}
      series:           ${{ steps.query.outputs.series }}
      source:           ${{ steps.query.outputs.source }}
      should_sync:      ${{ steps.gate.outputs.should_sync }}

    steps:
      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends jq

      # -----------------------------------------------------------------------
      # Query Launchpad REST API
      # -----------------------------------------------------------------------
      - name: Query Launchpad for latest published source
        id: query
        env:
          SERIES: ${{ inputs.series || vars.KERNEL_SERIES || 'noble' }}
          SOURCE: ${{ vars.KERNEL_SOURCE || 'linux' }}
        run: |
          API="https://api.launchpad.net/1.0/ubuntu/+archive/primary"
          API+="?ws.op=getPublishedSources"
          API+="&source_name=${SOURCE}"
          API+="&distro_series=/ubuntu/${SERIES}"
          API+="&status=Published"
          API+="&order_by_date=true"

          echo "Querying: ${API}"
          RESP=$(curl -fsSL "${API}")

          VERSION=$(echo "$RESP" | jq -r '.entries[0].source_package_version // empty')
          [ -n "${VERSION}" ] || {
            echo "ERROR: No version found for ${SOURCE} in ${SERIES}" >&2
            exit 1
          }

          UPSTREAM=$(echo "${VERSION}" | cut -d'-' -f1)
          TAG="${SERIES}-${VERSION}"

          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                   >> "$GITHUB_OUTPUT"
          echo "series=${SERIES}"             >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE}"             >> "$GITHUB_OUTPUT"

          echo "Series  : ${SERIES}"
          echo "Version : ${VERSION}"
          echo "Tag     : ${TAG}"

      # -----------------------------------------------------------------------
      # Gate: skip if the tag already exists (unless force=true)
      # -----------------------------------------------------------------------
      - name: Check whether tag already exists
        id: gate
        env:
          TAG: ${{ steps.query.outputs.tag }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Force flag set – will re-sync"
            exit 0
          fi

          if git ls-remote --exit-code --tags \
               "https://github.com/${{ github.repository }}.git" \
               "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' already exists – nothing to do"
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' not found – will sync"
          fi

  # --------------------------------------------------------------------------
  # Job 2: sync
  #   Downloads the source package, extracts it, and commits to the series
  #   branch.
  # --------------------------------------------------------------------------
  sync:
    name: "Sync ${{ needs.check-version.outputs.series }} sources to branch"
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    timeout-minutes: 120
    needs: check-version
    if: needs.check-version.outputs.should_sync == 'true'

    env:
      VERSION:          ${{ needs.check-version.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.check-version.outputs.upstream_version }}
      TAG:              ${{ needs.check-version.outputs.tag }}
      SERIES:           ${{ needs.check-version.outputs.series }}
      SOURCE:           ${{ needs.check-version.outputs.source }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout main branch to get the helper scripts
      # -----------------------------------------------------------------------
      - name: Checkout main (for scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          path: ci

      # -----------------------------------------------------------------------
      # 2. Install tools
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl jq devscripts dpkg-dev

      # -----------------------------------------------------------------------
      # 3. Download source package from Launchpad
      # -----------------------------------------------------------------------
      - name: Fetch source package from Launchpad
        run: |
          chmod +x ci/scripts/fetch-source-pkg.sh
          ci/scripts/fetch-source-pkg.sh "${SERIES}" "${SOURCE}" source-pkg/

          echo "Downloaded files:"
          ls -lh source-pkg/

      # -----------------------------------------------------------------------
      # 4. Extract source package (applies all Ubuntu patches via quilt)
      # -----------------------------------------------------------------------
      - name: Extract source package
        run: |
          DSC=$(find source-pkg/ -name "*.dsc" | sort -V | tail -1)
          echo "Extracting: ${DSC}"
          dpkg-source -x "${DSC}" kernel-src/

          # The extracted directory is named linux-<upstream_version>
          SRC_DIR=$(find kernel-src/ -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "Extracted to: ${SRC_DIR}"
          echo "SRC_DIR=${SRC_DIR}" >> "$GITHUB_ENV"

          echo "Top-level contents:"
          ls "${SRC_DIR}/"

      # -----------------------------------------------------------------------
      # 5. Configure git
      # -----------------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

      # -----------------------------------------------------------------------
      # 6. Prepare the series branch
      #    Clone the repo, check out (or create) the series branch, wipe it,
      #    populate with the freshly extracted source, commit, tag, push.
      # -----------------------------------------------------------------------
      - name: Clone repository for series branch update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git clone "${REPO_URL}" series-repo

      - name: Check out or create series branch
        run: |
          cd series-repo

          if git ls-remote --exit-code origin "refs/heads/${SERIES}" >/dev/null 2>&1; then
            echo "Branch '${SERIES}' exists – checking out"
            git checkout "${SERIES}"
            # Remove all existing content so we get a clean slate
            git rm -rf --quiet . 2>/dev/null || true
          else
            echo "Branch '${SERIES}' does not exist – creating orphan branch"
            git checkout --orphan "${SERIES}"
            git rm -rf --quiet . 2>/dev/null || true
          fi

      - name: Populate series branch with extracted source
        run: |
          echo "Copying source tree from ${SRC_DIR} → series-repo/"
          # rsync preserves permissions and handles large trees efficiently
          rsync -a --delete \
            --exclude='.git' \
            "${SRC_DIR}/" series-repo/

          cd series-repo

          # Write commit message to a file to avoid shell/YAML quoting issues
          SYNC_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          printf '%s\n\n%s\n%s\n%s\n%s\n%s\n' \
            "${SERIES}: ${VERSION}" \
            "Ubuntu series  : ${SERIES}" \
            "Kernel version : ${VERSION}" \
            "Upstream       : ${UPSTREAM_VERSION}" \
            "Source         : https://launchpad.net/ubuntu/${SERIES}/+source/${SOURCE}/${VERSION}" \
            "Synced         : ${SYNC_DATE}" \
            > /tmp/commit-msg.txt

          git add --all
          git commit -F /tmp/commit-msg.txt

          echo "Committed ${SERIES} branch at $(git rev-parse HEAD)"

      - name: Tag the commit
        run: |
          cd series-repo
          git tag -a "${TAG}" -m "Ubuntu ${SERIES} kernel ${VERSION}"
          echo "Tagged: ${TAG}"

      - name: Push series branch and tag
        run: |
          cd series-repo
          git push origin "${SERIES}"
          git push origin "${TAG}"
          echo "Pushed branch '${SERIES}' and tag '${TAG}'"

      # -----------------------------------------------------------------------
      # 7. Summary
      # -----------------------------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          echo "## Source Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Series   | \`${SERIES}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version  | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch   | [\`${SERIES}\`](https://github.com/${{ github.repository }}/tree/${SERIES}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag      | [\`${TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${TAG}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Launchpad | https://launchpad.net/ubuntu/${SERIES}/+source/${SOURCE}/${VERSION} |" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Job 3: trigger-build
  #   Dispatches build-kernel.yml for the newly synced version.
  # --------------------------------------------------------------------------
  trigger-build:
    name: "Trigger kernel build"
    runs-on: [self-hosted, lecore-prd-u2404-arm64-xlrg-od-ephem]
    needs: [check-version, sync]
    if: needs.sync.result == 'success'

    steps:
      - name: Dispatch build-kernel workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES:   ${{ needs.check-version.outputs.series }}
          VERSION:  ${{ needs.check-version.outputs.version }}
        run: |
          gh workflow run build-kernel.yml \
            --repo "${{ github.repository }}" \
            --field series="${SERIES}" \
            --field kernel_version="${VERSION}" \
            --field arch="arm64" \
            --field flavor="generic"

          echo "Build workflow dispatched for ${SERIES} ${VERSION}"
