# SPDX-License-Identifier: BSD-3-Clause
#
# fetch-source-pkg.yml
#
# Mirrors the Canonical Ubuntu kernel from the Launchpad git repository into
# a branch of this repo, preserving the complete upstream git history.
#
# Why git fetch + fast-forward instead of shallow clone + rsync?
#   The previous approach (git clone --depth=1 + rsync) created snapshot
#   commits with no connection to Canonical's history. The current approach
#   fetches the upstream tag with its full ancestry and fast-forwards our
#   branch to it, so git log, git diff, and git blame all work against
#   Canonical's actual commits.
#
# Why git instead of the source package?
#   The Ubuntu kernel source package (format 1.0) ships only debian.master/
#   with rules.d/ fragments — debian/rules is NOT included. The complete
#   debian/ directory (with rules, scripts/, templates/, etc.) lives in the
#   Launchpad git repository. Using the git source gives a buildable tree.
#
# Repository branch layout
# ─────────────────────────
#   main          – CI infrastructure: workflows, scripts, documentation
#   noble         – Ubuntu Noble (24.04 LTS) kernel source, full history
#   resolute-qcom – Ubuntu-qcom kernel source, full history (daily default)
#   <branch>      – additional branches added on demand
#
# Each branch tip is tagged  <branch>-<version>
# (e.g.  resolute-qcom-7.0.0-1003.3).
#
# Repository variables (Settings → Variables → Actions):
#   KERNEL_SUITE          – default branch to sync when not specified (default: resolute-qcom)
#   KERNEL_SOURCE         – source package name (default: linux)
#   KERNEL_CUSTOM_GIT_URL – default custom git URL for scheduled runs
#                           (default: https://git.launchpad.net/~carmel-team/ubuntu/+source/linux/+git/resolute)

name: "Sync: Canonical Kernel Sources to Branch"

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      suite:
        description: "Branch to sync into (e.g. resolute-qcom, noble, questing, resolute)"
        required: false
        default: "resolute-qcom"
        type: string
      force:
        description: "Re-sync even if this version is already committed"
        type: boolean
        default: false
      custom_git_url:
        description: "Git URL to clone from. Leave empty to use the official Ubuntu kernel repo."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

jobs:
  check-version:
    name: "Check latest version on Launchpad"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    outputs:
      version:          ${{ steps.query.outputs.version }}
      upstream_version: ${{ steps.query.outputs.upstream_version }}
      tag:              ${{ steps.query.outputs.tag }}
      suite:            ${{ steps.query.outputs.suite }}
      base_suite:       ${{ steps.query.outputs.base_suite }}
      source:           ${{ steps.query.outputs.source }}
      git_url:          ${{ steps.query.outputs.git_url }}
      git_tag_prefix:   ${{ steps.query.outputs.git_tag_prefix }}
      should_sync:      ${{ steps.gate.outputs.should_sync }}

    steps:
      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends jq

      - name: Resolve version and git URL
        id: query
        env:
          SUITE:          ${{ inputs.suite || vars.KERNEL_SUITE || 'resolute-qcom' }}
          SOURCE:         ${{ vars.KERNEL_SOURCE || 'linux' }}
          # For scheduled runs: fall back to vars.KERNEL_CUSTOM_GIT_URL or the
          # hardcoded carmel-team URL so the daily build always uses resolute-qcom.
          # For manual runs: use exactly what the user entered — empty string means
          # "use the official Ubuntu repo" (no custom URL → Launchpad REST API path).
          CUSTOM_GIT_URL: ${{ github.event_name == 'schedule' && (vars.KERNEL_CUSTOM_GIT_URL || 'https://git.launchpad.net/~carmel-team/ubuntu/+source/linux/+git/resolute') || inputs.custom_git_url }}
          # GIT_TAG_PREFIX is derived automatically:
          #   custom URL → Ubuntu-qcom  (Ubuntu-qcom-7.0.0-1003.3 style tags)
          #   official   → Ubuntu       (Ubuntu-X.Y.Z-A.B style tags, set in else branch)
          GIT_TAG_PREFIX: "Ubuntu-qcom"
        run: |
          # Derive the base Ubuntu suite by stripping any custom suffix.
          # e.g. resolute-qcom → resolute, noble → noble, questing → questing
          # Used for Launchpad API queries and default git URL construction.
          BASE_SUITE=$(echo "${SUITE}" | cut -d'-' -f1)
          echo "Suite      : ${SUITE}"
          echo "Base suite : ${BASE_SUITE}"

          if [ -n "${CUSTOM_GIT_URL}" ]; then
            # ----------------------------------------------------------------
            # Custom repo path: find the latest <GIT_TAG_PREFIX>-* tag via
            # git ls-remote. This bypasses the Launchpad REST API entirely —
            # the version is derived directly from the tags present in the
            # custom repository.
            #
            # The Ubuntu-qcom Launchpad repository uses tags of the form:
            #   Ubuntu-qcom-7.0.0-1003.3
            # so GIT_TAG_PREFIX defaults to "Ubuntu-qcom".
            # ----------------------------------------------------------------
            echo "Custom git URL    : ${CUSTOM_GIT_URL}"
            echo "Git tag prefix    : ${GIT_TAG_PREFIX}"
            echo "Querying tags from custom repo..."

            LATEST_TAG=$(git ls-remote --tags "${CUSTOM_GIT_URL}" "refs/tags/${GIT_TAG_PREFIX}-*" \
              | grep -v '\^{}' \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | sort -V \
              | tail -1)

            [ -n "${LATEST_TAG}" ] || {
              echo "ERROR: No ${GIT_TAG_PREFIX}-* tags found in ${CUSTOM_GIT_URL}" >&2
              exit 1
            }

            # Ubuntu-qcom-7.0.0-1003.3 → 7.0.0-1003.3
            VERSION="${LATEST_TAG#${GIT_TAG_PREFIX}-}"
            GIT_URL="${CUSTOM_GIT_URL}"

            echo "Latest tag : ${LATEST_TAG}"
          else
            # ----------------------------------------------------------------
            # Default path: query the Launchpad REST API for the latest
            # officially published source package version, then construct
            # the standard Launchpad git URL for the suite.
            # Official Ubuntu repos use Ubuntu-X.Y.Z-A.B tag format.
            # ----------------------------------------------------------------
            GIT_TAG_PREFIX="Ubuntu"

            API="https://api.launchpad.net/1.0/ubuntu/+archive/primary"
            API+="?ws.op=getPublishedSources"
            API+="&source_name=${SOURCE}"
            API+="&distro_series=/ubuntu/${BASE_SUITE}"
            API+="&status=Published"
            API+="&order_by_date=true"
            API+="&ws.size=300"

            echo "Querying: ${API}"
            RESP=$(curl -fsSL "${API}")

            VERSION=$(echo "$RESP" | jq -r \
              --arg name "${SOURCE}" \
              '[.entries[] | select(.source_package_name == $name)] | .[0].source_package_version // empty')
            [ -n "${VERSION}" ] || {
              echo "ERROR: No exact match for '${SOURCE}' in ${SUITE}" >&2
              exit 1
            }

            GIT_URL="https://git.launchpad.net/~ubuntu-kernel/ubuntu/+source/linux/+git/${BASE_SUITE}"
          fi

          UPSTREAM=$(echo "${VERSION}" | cut -d'-' -f1)
          TAG="${SUITE}-${VERSION}"

          echo "version=${VERSION}"               >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM}"     >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                       >> "$GITHUB_OUTPUT"
          echo "suite=${SUITE}"                   >> "$GITHUB_OUTPUT"
          echo "base_suite=${BASE_SUITE}"         >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE}"                 >> "$GITHUB_OUTPUT"
          echo "git_url=${GIT_URL}"               >> "$GITHUB_OUTPUT"
          echo "git_tag_prefix=${GIT_TAG_PREFIX}" >> "$GITHUB_OUTPUT"

          echo "Version    : ${VERSION}"
          echo "Tag        : ${TAG}"
          echo "Git URL    : ${GIT_URL}"
          echo "Tag prefix : ${GIT_TAG_PREFIX}"

      - name: Check whether tag already exists
        id: gate
        env:
          TAG: ${{ steps.query.outputs.tag }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Force flag set – will re-sync"
            exit 0
          fi

          if git ls-remote --exit-code --tags \
               "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
               "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' already exists – nothing to do"
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' not found – will sync"
          fi

  # ============================================================================
  # sync job
  #
  # Replaces the previous shallow-clone + rsync approach with a proper git
  # mirror pattern:
  #
  #   1. Clone our GitHub repo
  #   2. Add Launchpad as a second remote
  #   3. git fetch the upstream tag with its FULL ancestry (no --depth)
  #   4. Fast-forward our branch to the upstream tag
  #      (or create the branch on first sync)
  #   5. Place our scoped tag (e.g. resolute-qcom-7.0.0-1003.3) on the
  #      same Canonical commit — no extra snapshot commit is added
  #   6. Push branch + tag
  #
  # Result: our branch IS the upstream history. git log, git diff, and
  # git blame all work against Canonical's actual commits and authors.
  # Subsequent syncs are incremental — only new commits are fetched.
  # ============================================================================
  sync:
    name: "Sync ${{ needs.check-version.outputs.suite }} sources to branch"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    needs: check-version
    if: needs.check-version.outputs.should_sync == 'true'

    env:
      VERSION:          ${{ needs.check-version.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.check-version.outputs.upstream_version }}
      TAG:              ${{ needs.check-version.outputs.tag }}
      SUITE:            ${{ needs.check-version.outputs.suite }}
      SOURCE:           ${{ needs.check-version.outputs.source }}
      GIT_URL:          ${{ needs.check-version.outputs.git_url }}
      GIT_TAG_PREFIX:   ${{ needs.check-version.outputs.git_tag_prefix }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Free up disk space
      #    The full Canonical history fetch requires more headroom than the
      #    previous shallow clone. Freeing unused toolchains gives ~10 GB.
      # -----------------------------------------------------------------------
      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" \
            2>/dev/null || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      # -----------------------------------------------------------------------
      # 2. Install tools  (rsync no longer needed)
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl jq

      # -----------------------------------------------------------------------
      # 3. Configure git identity
      # -----------------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

      # -----------------------------------------------------------------------
      # 4. Mirror: fetch upstream history and fast-forward our branch
      #
      #    Strategy:
      #      • Clone our GitHub repo (contains existing branch history)
      #      • Add Launchpad as a second remote
      #      • git fetch the upstream tag with its complete ancestry
      #        (no --depth — full history is preserved; subsequent syncs
      #         are incremental, fetching only new commits)
      #      • Fast-forward our branch to the upstream tag
      #        If ff is impossible (upstream rebase/rewrite), reset --hard
      #        to maintain a clean mirror and push with --force-with-lease
      #      • Place our scoped tag on the same Canonical commit
      # -----------------------------------------------------------------------
      - name: Mirror upstream history into branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          GIT_TAG="${GIT_TAG_PREFIX}-${VERSION}"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # ------------------------------------------------------------------
          # Clone our GitHub repository
          # ------------------------------------------------------------------
          echo "=== Cloning our repository ==="
          git clone "${REPO_URL}" suite-repo
          cd suite-repo

          # ------------------------------------------------------------------
          # Add Launchpad as a second remote
          # ------------------------------------------------------------------
          echo "=== Adding Launchpad remote ==="
          git remote add launchpad "${GIT_URL}"
          echo "Remotes:"
          git remote -v

          # ------------------------------------------------------------------
          # Fetch the upstream tag with its ancestry.
          #
          # --depth=200: fetches the last 200 commits of history, which covers
          # several months of kernel development — enough for meaningful diffs
          # between versions without overloading Launchpad's git servers.
          # Subsequent syncs use --update-shallow to extend the shallow boundary
          # to include new commits while reusing already-fetched objects.
          #
          # Retry up to 3 times with a 30-second back-off to handle transient
          # Launchpad 503 / RPC errors.
          # ------------------------------------------------------------------
          echo "=== Fetching ${GIT_TAG} from ${GIT_URL} ==="
          FETCH_DEPTH=200
          MAX_RETRIES=3
          RETRY_DELAY=30

          for attempt in $(seq 1 ${MAX_RETRIES}); do
            echo "Fetch attempt ${attempt}/${MAX_RETRIES} (depth=${FETCH_DEPTH})..."
            if git fetch --depth="${FETCH_DEPTH}" --update-shallow \
                 launchpad "refs/tags/${GIT_TAG}:refs/tags/${GIT_TAG}"; then
              echo "✓ Fetch succeeded on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" -lt "${MAX_RETRIES}" ]; then
              echo "Fetch failed — retrying in ${RETRY_DELAY}s..."
              sleep "${RETRY_DELAY}"
            else
              echo "ERROR: Fetch failed after ${MAX_RETRIES} attempts" >&2
              exit 1
            fi
          done

          CANONICAL_COMMIT=$(git rev-parse "${GIT_TAG}")
          echo "Upstream commit  : ${CANONICAL_COMMIT}"
          echo "Upstream tag     : ${GIT_TAG}"

          # ------------------------------------------------------------------
          # Verify the source tree at the fetched tag
          # (git ls-tree is accurate and requires no working-tree checkout)
          # ------------------------------------------------------------------
          FILE_COUNT=$(git ls-tree -r --name-only "${GIT_TAG}" | wc -l)
          echo "Files at ${GIT_TAG}: ${FILE_COUNT}"
          [ "${FILE_COUNT}" -gt 5000 ] || {
            echo "ERROR: Too few files at tag (${FILE_COUNT}) — expected >5000"
            exit 1
          }

          echo "Top-level contents:"
          git ls-tree --name-only "${GIT_TAG}"

          echo "debian/ contents:"
          git ls-tree --name-only "${GIT_TAG}:debian" 2>/dev/null | head -20 \
            || echo "(debian/ not found at root — may be in a subdirectory)"

          # ------------------------------------------------------------------
          # Create or update our branch
          # ------------------------------------------------------------------
          FORCE_PUSH=false

          if git ls-remote --exit-code origin "refs/heads/${SUITE}" >/dev/null 2>&1; then
            echo "=== Branch '${SUITE}' exists — updating ==="
            git checkout "${SUITE}"

            # Fast-forward to the new upstream tag.
            # Ubuntu/carmel-team kernel history is linear so --ff-only
            # succeeds as long as the new tag descends from the branch tip.
            if git merge --ff-only "${GIT_TAG}"; then
              echo "✓ Fast-forwarded '${SUITE}' → ${GIT_TAG}"
            else
              # Non-linear history (upstream rebase or rewrite).
              # Reset to maintain a clean mirror of the upstream.
              echo "WARNING: Cannot fast-forward — upstream history is non-linear"
              echo "Resetting '${SUITE}' to ${GIT_TAG} (mirror reset)"
              git reset --hard "${GIT_TAG}"
              FORCE_PUSH=true
            fi
          else
            echo "=== Branch '${SUITE}' does not exist — creating ==="
            git checkout -b "${SUITE}" "${GIT_TAG}"
          fi

          echo "Branch tip: $(git rev-parse HEAD)"

          # ------------------------------------------------------------------
          # Place our scoped tag on the Canonical commit.
          # e.g. resolute-qcom-7.0.0-1003.3 → same commit as Ubuntu-qcom-7.0.0-1003.3
          # This preserves the full history chain — no extra snapshot commit.
          # ------------------------------------------------------------------
          echo "=== Tagging ==="
          git tag -fa "${TAG}" -m "${SUITE} kernel ${VERSION}"
          echo "Tagged: ${TAG} → $(git rev-parse HEAD)"

          # ------------------------------------------------------------------
          # Push branch and tag to GitHub.
          # --force-with-lease for the branch: safe force-push that fails if
          # the remote was updated by another process since our clone.
          # --force for the tag: tags are always overwritten on re-sync.
          # ------------------------------------------------------------------
          echo "=== Pushing ==="
          if [ "${FORCE_PUSH}" = "true" ]; then
            git push --force-with-lease origin "${SUITE}"
          else
            git push origin "${SUITE}"
          fi
          git push --force origin "${TAG}"
          echo "Pushed branch '${SUITE}' and tag '${TAG}'"

      # -----------------------------------------------------------------------
      # 5. Summary
      # -----------------------------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          GIT_TAG="${GIT_TAG_PREFIX}-${VERSION}"

          echo "## Source Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch      | \`${SUITE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version     | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch ref  | [\`${SUITE}\`](https://github.com/${{ github.repository }}/tree/${SUITE}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag         | [\`${TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${TAG}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Upstream    | \`${GIT_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Upstream tag| \`${GIT_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Launchpad   | https://launchpad.net/ubuntu/${SUITE}/+source/${SOURCE}/${VERSION} |" >> "$GITHUB_STEP_SUMMARY"

  trigger-build:
    name: "Trigger kernel build"
    runs-on: ubuntu-24.04-arm
    needs: [check-version, sync]
    if: needs.sync.result == 'success'

    steps:
      - name: Dispatch build-kernel workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE:    ${{ needs.check-version.outputs.suite }}
          VERSION:  ${{ needs.check-version.outputs.version }}
        run: |
          # Derive the kernel flavour from the branch name.
          # Custom branches (any branch with a suffix, e.g. resolute-qcom)
          # use the 'qcom' flavour. Official Ubuntu suite branches
          # (noble, questing, resolute — no suffix) use 'generic'.
          # This ensures the daily resolute-qcom build always uses qcom.
          if echo "${SUITE}" | grep -q '-'; then
            FLAVOR="qcom"
          else
            FLAVOR="generic"
          fi
          echo "Branch: ${SUITE}  →  Flavour: ${FLAVOR}"

          gh workflow run build-kernel.yml \
            --repo "${{ github.repository }}" \
            --field suite="${SUITE}" \
            --field kernel_version="${VERSION}" \
            --field arch="arm64" \
            --field flavor="${FLAVOR}" \
            --field runner="ubuntu-24.04-arm"

          echo "Build workflow dispatched for ${SUITE} ${VERSION} (flavor=${FLAVOR})"
